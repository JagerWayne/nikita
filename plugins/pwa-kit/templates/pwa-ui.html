<!-- 1. Put this CSS in the app's <style>. 2. Put the markup at the end of <body>. Restyle to match the game. -->
<style>
  :root { --hud-green: #00ff88; --hud-cyan: #00e5ff; --hud-amber: #ffaa00; --hud-red: #ff3344; --panel-bg: rgba(4, 14, 10, 0.88); }
  /* minimal card/button styles: delete these if the app already has .modal-card / .tac-btn / .btn-row */
  .modal-card { width: 100%; background: var(--panel-bg); border: 1px solid var(--hud-green); padding: 20px 24px; color: #d8ffe9; border-radius: 6px; font-family: monospace; }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .tac-btn { min-height: 46px; min-width: 120px; padding: 8px 16px; font: bold 13px monospace; letter-spacing: .12em; color: var(--hud-green); background: rgba(0,255,136,.1); border: 1px solid var(--hud-green); border-radius: 4px; cursor: pointer; }
  .tac-btn.danger { border-color: var(--hud-red); color: #ff7a88; background: rgba(255,51,68,.12); }
  #nk-confirm, #nk-progress { position: fixed; inset: 0; z-index: 100001; display: none; align-items: center; justify-content: center; background: rgba(2, 8, 6, 0.9); padding: 18px; }
  #nk-confirm .modal-card, #nk-progress .modal-card { max-width: 420px; text-align: center; }
  #nk-confirm h3 { color: var(--hud-amber); letter-spacing: 0.16em; margin-bottom: 10px; font-size: 16px; }
  #nk-confirm p { color: #b7e8cf; font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
  #nk-progress .pbar { height: 16px; border: 1px solid var(--hud-green); border-radius: 8px; overflow: hidden; background: rgba(0, 255, 136, 0.1); margin: 14px 0 10px; }
  #nk-progress .pbar i { display: block; height: 100%; width: 0; background: linear-gradient(to right, var(--hud-green), var(--hud-cyan)); transition: width 0.2s linear; }
  #nk-progress .ptext { font-size: 13px; color: #d8ffe9; letter-spacing: 0.06em; min-height: 1.4em; }
  #nk-strip { position: fixed; left: 50%; bottom: max(8px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 99998; display: none; min-width: 240px; max-width: 90vw; padding: 6px 12px; background: rgba(4, 14, 10, 0.92); border: 1px solid var(--hud-green); border-radius: 6px; font-size: 11px; letter-spacing: 0.08em; color: #d8ffe9; }
  #nk-strip .pbar { height: 6px; background: rgba(0, 255, 136, 0.15); border-radius: 3px; overflow: hidden; margin-top: 5px; }
  #nk-strip .pbar i { display: block; height: 100%; width: 0; background: var(--hud-green); transition: width 0.2s linear; }
  #nk-offline { position: fixed; right: max(8px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top)); z-index: 99997; display: none; padding: 3px 8px; font-size: 10px; letter-spacing: 0.12em; color: var(--hud-amber); border: 1px solid var(--hud-amber); border-radius: 4px; background: rgba(4, 14, 10, 0.8); pointer-events: none; }
</style>

<!-- In-app confirm dialog, update progress and offline badge -->
<div id="nk-confirm" role="dialog" aria-modal="true"><div class="modal-card">
  <h3 id="nk-confirm-title"></h3><p id="nk-confirm-text"></p>
  <div class="btn-row center"><button class="tac-btn" id="nk-confirm-cancel">CANCEL</button><button class="tac-btn danger" id="nk-confirm-ok">OK</button></div>
</div></div>
<div id="nk-progress" role="dialog" aria-modal="true"><div class="modal-card">
  <h3 style="color:var(--hud-green);letter-spacing:.16em;font-size:16px">UPDATING</h3>
  <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
  <div class="ptext" id="nk-progress-text"></div>
  <div class="btn-row center" style="margin-top:12px"><button class="tac-btn" id="nk-progress-retry" style="display:none">RETRY</button><button class="tac-btn" id="nk-progress-close" style="display:none">CLOSE</button></div>
</div></div>
<div id="nk-strip"><div id="nk-strip-text"></div><div class="pbar"><i></i></div></div>
<div id="nk-offline">OFFLINE</div>
